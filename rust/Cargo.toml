[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri", "tools/labserver"]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Achraf Tsouli"]
repository = "https://github.com/AchrafTsouli/flux-downloader"
publish = false

[workspace.dependencies]
flux-engine = { path = "crates/flux-engine" }
flux-store = { path = "crates/flux-store" }
flux-ipc = { path = "crates/flux-ipc" }
flux-media = { path = "crates/flux-media" }
flux-torrent = { path = "crates/flux-torrent" }
flux-update = { path = "crates/flux-update" }
flux-cli = { path = "crates/flux-cli" }
labserver = { path = "tools/labserver" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "signal"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "socks"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
url = "2"
sha2 = "0.10"
sha1 = "0.10"
getrandom = "0.2"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

# Debug builds (tests, cargo check) keep line numbers for our code only: the libraries we use
# carry no debug info, which keeps target/debug a few GB instead of 16.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Quick test builds (scripts/Build-Test.ps1): optimized, but without the whole-program link pass
# that makes release builds slow. Installers still use the release profile.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
