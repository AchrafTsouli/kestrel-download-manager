[package]
name = "kestrel-store"
description = "Kestrel's download history and settings (SQLite), with secrets protected for the user, and import from Flux 1.x"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[target.'cfg(not(windows))'.dependencies]
chacha20poly1305 = "0.10"
getrandom.workspace = true

[dev-dependencies]
kestrel-engine.workspace = true
