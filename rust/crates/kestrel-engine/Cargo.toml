[package]
name = "kestrel-engine"
description = "Kestrel's download engine: segmented HTTP(S) downloads into one sparse file, resume, host limits, speed limits"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
parking_lot.workspace = true
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
bytes.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
sha2.workspace = true
suppaftp = { version = "12.2.1", default-features = false, features = ["tokio", "tokio-rustls-ring"] }
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
base64 = { version = "0.22", default-features = false }
percent-encoding = { version = "2", default-features = false }
webpki-roots = { version = "1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
labserver.workspace = true
kestrel-update.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde_json.workspace = true
sha2.workspace = true
url.workspace = true
