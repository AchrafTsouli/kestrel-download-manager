[package]
name = "kestrel-ipc"
description = "Kestrel's browser bridge protocol (same messages as Flux 1.x) and the per-user pipe between the native host and the app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
sha2.workspace = true
kestrel-engine.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Memory", "Win32_System_Console"] }
