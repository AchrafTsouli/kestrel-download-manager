[package]
name = "flux-nmhost"
description = "Flux's native messaging host: the browser extension talks to Flux through it"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "flux-nmhost"
path = "src/main.rs"

[dependencies]
flux-ipc.workspace = true
flux-store.workspace = true
tokio = { workspace = true, features = ["io-std"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
