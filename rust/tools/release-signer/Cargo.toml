[package]
name = "release-signer"
description = "Signs Kestrel's update feed (version.json) with the release key; replaces Flux 1.x's C# UpdateSigner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
kestrel-update.workspace = true
kestrel-store.workspace = true
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "std"] }
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2.workspace = true
serde_json.workspace = true
aes-gcm = "0.10"
pbkdf2 = "0.12"
rpassword = "7"
