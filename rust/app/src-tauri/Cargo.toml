[package]
name = "kestrel-app"
description = "Kestrel desktop app (Tauri 2)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "kestrel"
path = "src/main.rs"

[lib]
name = "kestrel_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
parking_lot.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
regex.workspace = true
base64 = "0.22"
png = "0.18"
reqwest.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
kestrel-engine.workspace = true
kestrel-store.workspace = true
kestrel-ipc.workspace = true
kestrel-media.workspace = true
kestrel-torrent.workspace = true
kestrel-update.workspace = true
arboard = { version = "3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-drag = "2"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_Media_Audio", "Win32_Security", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
