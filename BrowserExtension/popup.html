<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kestrel</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <img src="icon-48.png" alt="" width="34" height="34">
    <div class="name"><strong>Kestrel</strong><span>Download Manager</span></div>
    <span id="state" class="state checking" role="status"><i></i><b>Checking…</b></span>
  </header>

  <section class="site" id="site-card" hidden>
    <div class="site-text">
      <span class="label">This site</span>
      <strong id="site-name"></strong>
    </div>
    <label class="switch" title="Pause Kestrel on this site only">
      <input id="site" type="checkbox"><span></span>
    </label>
  </section>

  <section class="card">
    <label class="row">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 19h16"/></svg></span>
      <span class="text"><strong>Capture downloads</strong><small>File links and browser downloads open in Kestrel</small></span>
      <span class="switch"><input id="capture" type="checkbox"><span></span></span>
    </label>
    <label class="row">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg></span>
      <span class="text"><strong>Video download button</strong><small>Shows “Download this video” over playing videos</small></span>
      <span class="switch"><input id="videos" type="checkbox"><span></span></span>
    </label>
  </section>

  <div class="actions">
    <button id="open" class="primary">Open Kestrel</button>
    <button id="add" title="Add this page's address to Kestrel">Download this page</button>
  </div>
  <div class="actions">
    <button id="refresh-videos" class="ghost">Find videos on this tab</button>
    <button id="test" class="ghost">Test connection</button>
  </div>

  <p id="status" class="message" role="status" hidden></p>

  <footer>
    <span id="hint">Right-click a link → “Download with Kestrel”</span>
    <span id="version"></span>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
