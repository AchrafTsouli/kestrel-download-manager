name: Flux 2.0 (Rust)

on:
  push:
    paths: ["rust/**", ".github/workflows/flux2.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/flux2.yml"]

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust/app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build the interface
        working-directory: rust/app
        run: |
          npm ci
          npm run build
      - name: Tests (engine, storage, lab server)
        run: cargo test --workspace
      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious
      - name: App build (no installer yet)
        working-directory: rust/app
        run: npx tauri build --no-bundle

  # Linux and macOS: tests, then the packages (.deb + AppImage, .app + .dmg) kept as artifacts.
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust/app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Build the interface
        working-directory: rust/app
        run: |
          npm ci
          npm run build
      - name: Tests
        working-directory: rust
        run: cargo test --workspace
      - name: Packages
        run: |
          cargo install tauri-cli --version "^2" --locked
          SKIP_FRONTEND=1 scripts/build-flux2-unix.sh
      - uses: actions/upload-artifact@v4
        with:
          name: flux-${{ runner.os }}
          path: |
            rust/target/release/bundle/deb/*.deb
            rust/target/release/bundle/appimage/*.AppImage
            rust/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
